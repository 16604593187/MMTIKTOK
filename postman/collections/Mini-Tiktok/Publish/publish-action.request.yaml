$kind: http-request
name: 'Publish action'
method: POST
url: '{{base_url}}/douyin/publish/action'
order: 6000
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: token
      value: '{{token}}'
      description: 用户鉴权 token
    - key: title
      value: '{{title}}'
      description: 视频标题
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
