$kind: http-request
name: 'Get user'
method: GET
url: '{{base_url}}/douyin/user'
order: 5000
queryParams:
  - key: user_id
    value: '{{user_id}}'
    description: 用户id
  - key: token
    value: '{{token}}'
    description: 用户鉴权token
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
